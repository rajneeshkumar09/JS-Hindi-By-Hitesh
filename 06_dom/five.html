<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>

    <script>
        // Basic method. This is traverse the whole tree of the document. It gives optimisition issue.
        function addLanguage(langName) {
            const li = document.createElement('li');
            li.innerHTML = `${langName}`;
            document.querySelector(".language").appendChild(li);
        }
        addLanguage("Python");
        addLanguage("Typescript");

        /* ===> Add element on web page <=== */
        function addOptiLanguage(langName) {
            const li = document.createElement("li");
            li.appendChild(document.createTextNode(langName));      // add text into li element
            document.querySelector(".language").appendChild(li);
        }
        addOptiLanguage("golang");

        /* ===> Edit element on web page <=== */
        const secondLang = document.querySelector("li:nth-child(2)");
        //secondLang.innerHTML = "Mojo";
        const newLi = document.createElement("li");
        newLi.textContent = "Mojo";
        secondLang.replaceWith(newLi); //Used to replace content which is already exist.

        /* ===> Edit element on web page <=== */
        const firstLang = document.querySelector("li:first-child");
        firstLang.outerHTML = "<li>Java</li>"   //It is compulsory to write with HTML Element when you used the method "outerHTML"

        /* ===> Remove element on web page <=== */
        const lastLang = document.querySelector("li:last-child");
        lastLang.remove();
    </script>
</body>
</html>
